input {
  beats {
    port => 5044
  }
}

filter {
  # RULE 1: TRUNCATION (Defeats Buffer Overflows & ReDoS)
  # Maliciously long strings are designed to lock up regex engines. 
  # If a standard log should never exceed 500 characters, truncate it immediately.
  grok {
    match => { "message" => "^(?<truncated_message>.{1,500})" }
    tag_on_failure => ["_truncation_applied"]
  }

  # Use the safely bounded string for all subsequent steps
  mutate {
    copy => { "truncated_message" => "processing_payload" }
  }

  # RULE 2: DISSECT FIRST (Structural Boundary Enforcement)
  # Dissect does not use Regular Expressions; it uses exact string splitting.
  # This makes it immune to regular expression denial of service (ReDoS) crashes.
  dissect {
    mapping => {
      "processing_payload" => "%{client_ip} %{method} %{request} %{status} %{duration}"
    }
  }

  # RULE 3: INJECTION SANITIZATION (Defeats Log4j / RCE attempts)
  # Strip out common exploit signatures ($ { j n d i : ) before any execution engine touches them.
  if [processing_payload] =~ /\$\{[jJ][nN][dD][iI]:/ {
    mutate {
      update => { "processing_payload" => "MALICIOUS_PAYLOAD_STRIPPED" }
      add_tag => [ "attack_attempt", "critical_alert" ]
    }
  }

  # RULE 4: STRICT DATATYPE VALIDATION (Defeats Field Poisoning)
  # Explicitly validate that data looks exactly like it should before allowing downstream mutations.
  if [status] !~ /^\d{3}$/ {
    mutate {
      update => { "status" => "000" }
      add_tag => [ "malformed_status_field" ]
    }
  }

  # RULE 5: FINAL CLEANUP (Reduces Exfiltration Footprint)
  # Drop the raw global message completely so an attacker cannot smuggle hidden payloads.
  mutate {
    remove_field => [ "message", "truncated_message", "event", "host" ]
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "local-logs-%{+YYYY.MM.dd}"
  }
  stdout { codec => rubydebug }
}
